<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Update Popup</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="lib/tableau.extensions.1.latest.min.js"></script>
</head>
<body>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="popup">
      <button id="closeBtn" class="close" aria-label="닫기">×</button>

      <div class="header">
        <div id="title" class="title">업데이트 안내</div>
        <div id="version" class="version"></div>
      </div>

      <ul id="items" class="items"></ul>

      <!-- ✅ 하단 고정 버튼 영역 -->
      <div class="footer">
        <button id="dontShowBtn" type="button" class="btn secondary">다시 보지 않기</button>
        <button id="closeBtn2" type="button" class="btn primary">닫기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
