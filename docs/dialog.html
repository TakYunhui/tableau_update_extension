<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Update Popup</title>

  <link rel="stylesheet" href="styles.css?v=12" />
  <script src="lib/tableau.extensions.1.latest.min.js"></script>
</head>
<body>
  <div id="popup">
    <div class="header">
      <div class="header-left">
        <div class="title-row">
          <div class="title">업데이트 내역</div>
          <div id="headerDate" class="header-date"></div>
        </div>
      </div>

      <div class="header-actions">
        <button id="dontShowBtn" type="button" class="dont-top">다시 보지 않기</button>
      </div>
    </div>

    <!-- ✅ 구분선 -->
    <div class="divider"></div>

    <ul id="items" class="items"></ul>

    <!-- ✅ 하단에도 일자(원하면 유지/삭제 가능) -->
    <div id="updatedAt" class="updated-at"></div>
  </div>

  <script src="dialog.js?v=12"></script>
</body>
</html>
